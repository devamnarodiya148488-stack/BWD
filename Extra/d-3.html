<!-- Create a html file to draw different shapes. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Different Shapes</title>

    <style>
        .circle {
            width: 100px;
            height: 100px;
          background-color: black;
          border-radius: 50px;
            margin: 20px;
        }

        .square {
            width: 100px;
            height: 100px;
            border-bottom: 150px solid purple;
            margin: 20px;
        }

        .rectangle {
            width: 150px;
            height: 100px;
            border-bottom: 150px solid purple;
            margin: 20px;
        }

        .triangle {
            width: 0;
            height: 0;
            border-left: 75px solid transparent;
            border-right: 75px solid transparent;
            margin: 20px   ;
          border-bottom: 150px solid purple;
        }
    </style>
</head>

<body align="center">

    <h1>Different Shapes</h1>

    <div class="circle"></div>
    <div class="square"></div>
    <div class="rectangle"></div>
    <div class="oval"></div>
    <div class="triangle"></div>

</body>
</html>
